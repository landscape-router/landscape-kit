[workspace]
members = [
    "lkit-cli",
    "landscape-flare",
    "landscape-terrain-proto",
    "crates/lkit-hostnet",
    "crates/lkit-publish",
    "crates/lkit-repository",
    "crates/lkit-test-fixture",
]
default-members = ["lkit-cli", "landscape-flare"]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
axum-server = "0.8"
aws-config = "1"
aws-sdk-s3 = "1"
chacha20poly1305 = "0.10.1"
chrono = "0.4"
clap = "4.6.6"
crossterm = "0.29"
dotenvy = "0.15.7"
flate2 = "1"
futures-util = "0.3"
glob = "0.3.4"
libc = "0.2"
lkit-repository = { path = "crates/lkit-repository" }
lkit-test-fixture = { path = "crates/lkit-test-fixture" }
mac_address = "1.1.8"
pcap = "2.4.0"
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false }
rust-i18n = "4.2.1"
rustls = "0.23"
scrypt = "0.11"
semver = "1"
serde = "1"
serde_json = "1"
sha2 = "0.11"
shell-words = "1"
smoltcp = { version = "0.12", features = ["medium-ip", "proto-ipv4", "socket-tcp"] }
tar = "0.4"
thiserror = "2"
tokio = "1.53.1"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"
url = "2"
uuid = "1"
zip = { version = "2", default-features = false }
zstd = "0.13"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
