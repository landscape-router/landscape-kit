[workspace]
resolver = "2"
members = [
    "crates/lkit-core",
    "crates/lkit-client",
    "crates/lkit-app",
    "crates/lkit-mirror",
    "crates/lkit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = "1"
async-trait = "0.1"

# CLI
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "stream"] }

# Interactive UI
dialoguer = "0.11"

# Tables
comfy-table = "7"

# Progress bars
indicatif = "0.17"

# Signal handling
ctrlc = "3"

# System
libc = "0.2"
nix = { version = "0.29", features = ["user", "fs", "hostname", "process"] }

# Config parsing
toml = "0.8"
toml_edit = "0.22"

# Mirror / S3
rusty-s3 = "0.9"
axum = "0.8"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
chrono = "0.4"
rand = "0.8"
futures = "0.3"

# Zip
zip = "2"

# Testing
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
panic = "abort"