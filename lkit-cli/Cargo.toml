[package]
name = "lkit-cli"
version.workspace = true
edition.workspace = true

[features]
default = []
test-support = ["dep:lkit-test-fixture", "dep:termlens"]
# 演示/安全试运行构建:TUI 面板的后台操作(安装、换源、备份、部署、
# 环境检查)全部替换为脚本化 mock,可在任何测试机上随手点而不会改动
# 环境。产物必须在 UI(header 徽标)与 `--version` 中显式标注 (demo);
# 发布流水线构建时禁用本特征并对产物断言。
demo = []

[[bin]]
name = "lkit"
path = "src/main.rs"

[[bin]]
name = "lkit-landscape-fixture"
path = "src/bin/lkit-landscape-fixture.rs"
required-features = ["test-support"]

[[bin]]
name = "lkit-test-systemctl"
path = "src/bin/lkit-test-systemctl.rs"
required-features = ["test-support"]

[[bin]]
name = "lkit-test-init"
path = "src/bin/lkit-test-init.rs"
required-features = ["test-support"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
crossterm = { workspace = true }
dotenvy = { workspace = true }
landscape-terrain-proto = { path = "../landscape-terrain-proto" }
libc = { workspace = true }
ratatui = { workspace = true, features = ["crossterm_0_29"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal"] }
unicode-width = { workspace = true }
futures-util = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
lkit-repository = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "http2", "rustls-tls", "stream"] }
rust-i18n = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
zip = { workspace = true, features = ["deflate"] }
zstd = { workspace = true }
lkit-test-fixture = { workspace = true, optional = true }
termlens = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["filters"] }

[build-dependencies]
toml = { workspace = true }
