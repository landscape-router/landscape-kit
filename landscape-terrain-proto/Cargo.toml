[package]
name = "landscape-terrain-proto"
version = "0.1.0"
edition.workspace = true
description = "Terrain L2 emergency-management protocol: wire format, crypto, handshake state machines, userspace TCP/IP stack and platform link layer"
license = "AGPL-3.0"
repository = "https://github.com/landscape-router/landscape-kit"
readme = "README.md"

[dependencies]
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
scrypt = { workspace = true }
sha2 = { workspace = true }
smoltcp = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
mac_address = { workspace = true }
pcap = { workspace = true }
