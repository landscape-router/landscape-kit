[package]
name = "lkit-test-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "landscape-webserver"
path = "src/bin/landscape-webserver.rs"

[[bin]]
name = "lkit-test-systemctl"
path = "src/bin/lkit-test-systemctl.rs"

[[bin]]
name = "lkit-fixture-release"
path = "src/bin/lkit-fixture-release.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4.6.5", features = ["derive"] }
libc = "0.2"
rcgen = "0.14"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
shell-words = "1"
tokio = { version = "1.53.1", features = ["full"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
