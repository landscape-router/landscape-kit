[package]
name = "lkit-test-fixture"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "landscape-webserver"
path = "src/bin/landscape-webserver.rs"

[[bin]]
name = "lkit-test-systemctl"
path = "src/bin/lkit-test-systemctl.rs"

[[bin]]
name = "lkit-fixture-release"
path = "src/bin/lkit-fixture-release.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true, features = ["tls-rustls"] }
clap = { workspace = true, features = ["derive"] }
libc = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
shell-words = { workspace = true }
tokio = { workspace = true, features = ["full"] }
zip = { workspace = true, features = ["deflate"] }
zstd = { workspace = true }
