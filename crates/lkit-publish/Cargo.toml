[package]
name = "lkit-publish"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lkit-publish"
path = "src/main.rs"

[dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
clap = { version = "4.6.5", features = ["derive", "env"] }
lkit-repository = { path = "../lkit-repository" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
