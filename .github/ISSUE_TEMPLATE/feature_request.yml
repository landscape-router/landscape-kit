name: 功能请求 / Feature request
description: 提议新功能或改进。Propose a new feature or enhancement.
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: "动机 / Motivation"
      description: "这个功能解决什么问题？谁会受益？What problem would this solve? Who benefits?"
      placeholder: "作为 [用户角色]，我希望 [目标] 以便 [原因]... / As a [user], I want [goal] so that [reason]..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "方案 / Proposal"
      description: "功能长什么样？描述要具体到能评估可行性。What would the feature look like? Be specific enough to evaluate feasibility."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "已考虑的替代方案 / Alternatives considered"
      description: "绕过方式、被否定的方案、为什么选这个方案。Workarounds, rejected approaches, or why this approach over others."

  - type: dropdown
    id: scope
    attributes:
      label: "影响范围 / Affected scope"
      description: "涉及哪个领域？Which area would this touch?"
      options:
        - "CLI 命令与交互 / CLI commands & UX"
        - "安装与生命周期 / Install & lifecycle"
        - "备份与恢复 / Backup & restore"
        - "升级与回滚 / Upgrade & rollback"
        - "诊断 / Diagnostics"
        - "核心应用层 / Core & app layer"
        - "多个领域 / Multiple areas"
        - "其他 / Other"
