name: Test flare e2e

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  workflow_dispatch:
    inputs:
      scenario:
        description: Run one scenario or the full matrix
        required: false
        default: all
        type: choice
        options:
          - all
          - connections
          - containerlab
          - windows-npcap
          - docker
          - double-capture
          - same-segment
          - multiclient
          - ratelimit
          - daemon

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: flare-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || inputs.scenario != 'windows-npcap'
    name: Prepare flare e2e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build workspace once
        run: cargo build --locked --workspace
      - name: Check out the v5 interoperability reference
        id: legacy
        if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","docker","ratelimit","containerlab"]'), inputs.scenario)
        uses: actions/checkout@v7
        with:
          ref: 4066d14f5b660856c9c544c36b024b2050026556
          path: v5-reference
      - name: Build the reference daemon once
        if: steps.legacy.outcome == 'success'
        run: |
          cargo build --locked --manifest-path v5-reference/Cargo.toml --target-dir "$RUNNER_TEMP/v5-target" -p lkit-cli --bin lkit
          install "$RUNNER_TEMP/v5-target/debug/lkit" target/debug/lkit-v5
      - name: Package Linux executables
        env:
          WITH_V5: ${{ steps.legacy.outcome == 'success' }}
        run: |
          binaries=(lkit lflare)
          if [[ $WITH_V5 == true ]]; then binaries+=(lkit-v5); fi
          tar -C target/debug -czf "$RUNNER_TEMP/flare-linux.tar.gz" "${binaries[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: flare-linux
          path: ${{ runner.temp }}/flare-linux.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  windows-client:
    name: Build Windows client and validate the Npcap smoke script
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo build --locked -p landscape-flare --bin lflare
      - name: Check PowerShell syntax and report installed capture driver
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/flare/windows-*.ps1) {
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
          }
          $driver = Get-Service npcap -ErrorAction SilentlyContinue
          if ($driver) { "Npcap service: $($driver.Status)" } else { "Npcap service absent" }
      - uses: actions/upload-artifact@v7
        with:
          name: lflare-windows
          path: target/debug/lflare.exe
          retention-days: 2

  e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.scenario != 'windows-npcap'
    name: Flare e2e (${{ matrix.scenario }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scenario != 'all' && format('["{0}"]', inputs.scenario) || '["containerlab","connections","docker","double-capture","same-segment","multiclient","ratelimit","daemon"]') }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flare-linux
          path: ${{ runner.temp }}
      - name: Unpack this run's Linux executables
        run: |
          mkdir -p target/debug
          tar -C target/debug -xzf "$RUNNER_TEMP/flare-linux.tar.gz"
      - name: Prepare containerlab and the static Linux binaries
        if: matrix.scenario == 'containerlab'
        run: bash scripts/flare/prepare-containerlab.sh
      - name: Run ${{ matrix.scenario }} e2e
        # The e2e image installs runtime dependencies via apt inside the
        # Dockerfile (no .deb files are present in CI); locally the scripts
        # use the offline .deb set from scripts/flare/fetch-packages.sh.
        env:
          FLARE_E2E_SKIP_BUILD: "1"
        run: scripts/flare/e2e-${{ matrix.scenario }}.sh

  windows-npcap:
    name: Windows/Npcap guest on the containerlab LAN
    if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'windows-npcap'
    needs: windows-client
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the private Windows test image
        env:
          IMAGE_URL: ${{ secrets.FLARE_WINDOWS_IMAGE_URL }}
          IMAGE_SHA256: ${{ vars.FLARE_WINDOWS_IMAGE_SHA256 }}
        run: |
          : "${IMAGE_URL:?Set FLARE_WINDOWS_IMAGE_URL to the prepared private qcow2}"
          [[ $IMAGE_SHA256 =~ ^[a-fA-F0-9]{64}$ ]]
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 "$IMAGE_URL" -o "$RUNNER_TEMP/windows.qcow2"
          echo "$IMAGE_SHA256  $RUNNER_TEMP/windows.qcow2" | sha256sum -c -
      - uses: actions/download-artifact@v8
        with:
          name: lflare-windows
          path: windows-client
      - name: Prepare the isolated LAN and QEMU
        run: |
          bash scripts/flare/prepare-containerlab.sh
          sudo apt-get install -y acl qemu-system-x86 genisoimage
      - name: Verify both router mappings from the Windows guest
        env:
          FLARE_WINDOWS_IMAGE: ${{ runner.temp }}/windows.qcow2
        run: scripts/flare/e2e-containerlab.sh
