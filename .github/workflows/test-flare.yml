name: Test flare e2e

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flare-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Flare L2 e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace
        run: cargo build --locked --workspace
      - name: Fetch debian packages in a trixie container
        # The runner distro (Ubuntu 24.04) ships a different .deb set than
        # the trixie e2e image; download inside the matching container.
        run: |
          docker run --rm -v "$PWD/scripts/flare:/workspace" \
            debian:13-slim@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258 \
            bash -c 'apt-get update -qq && cd /workspace && ./fetch-packages.sh'
      - name: Run flare e2e
        run: |
          scripts/flare/e2e-docker.sh
          scripts/flare/e2e-same-segment.sh
          scripts/flare/e2e-multiclient.sh
          scripts/flare/e2e-ratelimit.sh
