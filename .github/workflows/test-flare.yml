name: Test flare e2e

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  workflow_dispatch:
    inputs:
      scenario:
        description: Run one scenario or the full matrix
        required: false
        default: all
        type: choice
        options:
          - all
          - connections
          - docker
          - double-capture
          - same-segment
          - multiclient
          - ratelimit
          - daemon

permissions:
  contents: read

concurrency:
  group: flare-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare flare e2e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore or save Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-flare-e2e-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace once
        run: cargo build --locked --workspace

  e2e:
    name: Flare e2e (${{ matrix.scenario }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scenario != 'all' && format('["{0}"]', inputs.scenario) || '["connections","docker","double-capture","same-segment","multiclient","ratelimit","daemon"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore prepared Cargo build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-flare-e2e-${{ hashFiles('**/Cargo.lock') }}
      # Rebuild on top of the restored cache: the cache key only tracks
      # Cargo.lock, so on a key hit the cache holds binaries built from an
      # older source tree, and the prepare job's fresh build never reaches
      # this job (a cache hit is never re-saved). Building here (a quick
      # incremental pass) is what makes the scripts under test match this
      # checkout instead of whatever the cache froze.
      - name: Rebuild the checkout under test
        run: cargo build --locked --workspace
      - name: Run ${{ matrix.scenario }} e2e
        # The e2e image installs runtime dependencies via apt inside the
        # Dockerfile (no .deb files are present in CI); locally the scripts
        # use the offline .deb set from scripts/flare/fetch-packages.sh.
        env:
          FLARE_E2E_SKIP_BUILD: "1"
        run: scripts/flare/e2e-${{ matrix.scenario }}.sh
