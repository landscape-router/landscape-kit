name: Test flare e2e

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flare-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Flare L2 e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace
        run: cargo build --locked --workspace
      - name: Run flare e2e
        # The e2e image installs runtime dependencies via apt inside the
        # Dockerfile (no .deb files are present in CI); locally it uses the
        # offline .deb set from scripts/flare/fetch-packages.sh.
        run: |
          scripts/flare/e2e-docker.sh
          scripts/flare/e2e-same-segment.sh
          scripts/flare/e2e-multiclient.sh
          scripts/flare/e2e-ratelimit.sh
          scripts/flare/e2e-daemon.sh
