name: Test flare e2e

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - landscape-flare/**
      - landscape-terrain-proto/**
      - lkit-cli/**
      - scripts/flare/**
      - .github/workflows/test-flare.yml
      - .github/workflows/test-rust.yml
  workflow_dispatch:
    inputs:
      scenario:
        description: Run one scenario or the full matrix
        required: false
        default: all
        type: choice
        options:
          - all
          - connections
          - containerlab
          - docker
          - double-capture
          - same-segment
          - multiclient
          - ratelimit
          - daemon

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: flare-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare flare e2e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Restore or save Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-flare-e2e-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace once
        run: cargo build --locked --workspace

  windows-client:
    name: Build Windows client and validate the Npcap smoke script
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p landscape-flare --bin lflare
      - name: Check PowerShell syntax and report installed capture driver
        shell: pwsh
        run: |
          $errors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/flare/windows-npcap-smoke.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
          $driver = Get-Service npcap -ErrorAction SilentlyContinue
          if ($driver) { "Npcap service: $($driver.Status)" } else { "Npcap service absent" }
      - uses: actions/upload-artifact@v7
        with:
          name: lflare-windows
          path: target/debug/lflare.exe
          retention-days: 2

  e2e:
    name: Flare e2e (${{ matrix.scenario }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scenario != 'all' && format('["{0}"]', inputs.scenario) || '["containerlab","connections","docker","double-capture","same-segment","multiclient","ratelimit","daemon"]') }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Restore prepared Cargo build
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-flare-e2e-${{ hashFiles('**/Cargo.lock') }}
      # Rebuild on top of the restored cache: the cache key only tracks
      # Cargo.lock, so on a key hit the cache holds binaries built from an
      # older source tree, and the prepare job's fresh build never reaches
      # this job (a cache hit is never re-saved). Building here (a quick
      # incremental pass) is what makes the scripts under test match this
      # checkout instead of whatever the cache froze.
      - name: Rebuild the checkout under test
        run: cargo build --locked --workspace
      - name: Check out the v5 interoperability reference
        if: contains(fromJSON('["docker","ratelimit","containerlab"]'), matrix.scenario)
        uses: actions/checkout@v7
        with:
          ref: 4066d14f5b660856c9c544c36b024b2050026556
          path: v5-reference
      - name: Build the reference daemon
        if: contains(fromJSON('["docker","ratelimit","containerlab"]'), matrix.scenario)
        run: |
          cargo build --locked --manifest-path v5-reference/Cargo.toml --target-dir "$RUNNER_TEMP/v5-target" -p lkit-cli --bin lkit
          install "$RUNNER_TEMP/v5-target/debug/lkit" target/debug/lkit-v5
          rm -rf "$RUNNER_TEMP/v5-target"
      - name: Prepare containerlab and the static Linux binaries
        if: matrix.scenario == 'containerlab'
        run: |
          base=https://github.com/srl-labs/containerlab/releases/download/v0.69.3
          package=containerlab_0.69.3_linux_amd64.deb
          curl -fsSLO "$base/$package"
          curl -fsSL "$base/checksums.txt" | grep -F "$package" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y "./$package" musl-tools
          rustup target add x86_64-unknown-linux-musl
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="--cfg tokio_unstable -C target-feature=+crt-static -C relocation-model=static"
          cargo build --locked --target x86_64-unknown-linux-musl -p lkit-cli --bin lkit -p landscape-flare --bin lflare
          for app in lkit lflare; do
            file "target/x86_64-unknown-linux-musl/debug/$app"
            if readelf -lW "target/x86_64-unknown-linux-musl/debug/$app" | grep -q INTERP; then exit 1; fi
          done
      - name: Run ${{ matrix.scenario }} e2e
        # The e2e image installs runtime dependencies via apt inside the
        # Dockerfile (no .deb files are present in CI); locally the scripts
        # use the offline .deb set from scripts/flare/fetch-packages.sh.
        env:
          FLARE_E2E_SKIP_BUILD: "1"
        run: scripts/flare/e2e-${{ matrix.scenario }}.sh
