name: Release lkit and lflare

on:
  push:
    branches:
      - build/musl-static
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lkit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out landscape-kit
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "lkit-cli"))')
          if [[ -z "$TAG" ]]; then
            echo "version=$package_version" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release tag must be a SemVer in vX.Y.Z form, optionally with a prerelease suffix such as -rc.1" >&2
            exit 1
          fi
          version=${TAG#v}
          if [[ $package_version != "$version" ]]; then
            echo "tag version $version does not match lkit-cli package version $package_version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-verify

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --locked

      - name: Run Rust tests
        env:
          LKIT_E2E: "1"
        run: cargo test --features test-support

      - name: Check installer scripts
        run: |
          shellcheck scripts/install-lkit.sh scripts/test-install-lkit.sh scripts/build-musl-static.sh scripts/test-build-musl-static.sh
          scripts/test-install-lkit.sh
          bash scripts/test-build-musl-static.sh

  build:
    name: Build static Linux (${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            emulator: ""
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            emulator: qemu-aarch64
          - arch: riscv64
            target: riscv64gc-unknown-linux-musl
            emulator: qemu-riscv64
          - arch: loongarch64
            target: loongarch64-unknown-linux-musl
            emulator: qemu-loongarch64
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl-${{ matrix.target }}
          cache-on-failure: true
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils
          python3 -m pip install --user --break-system-packages ziglang==0.16.0
          cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Build static binaries
        run: bash scripts/build-musl-static.sh '${{ matrix.target }}'
      - name: Smoke test static binaries
        env:
          EMULATOR: ${{ matrix.emulator }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          actual=$($EMULATOR "dist/lkit-$ARCH" --version)
          test "$actual" = "lkit $VERSION"
          $EMULATOR "dist/lflare-linux-$ARCH" --help >/dev/null
          for binary in dist/lkit-* dist/lflare-linux-*; do
            file "$binary" | grep stripped
            size=$(stat -c '%s' "$binary")
            printf -- '- %s: %s bytes\n' "${binary##*/}" "$size" >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lkit-musl-${{ matrix.arch }}
          path: |
            dist/lkit-*
            dist/lflare-linux-*
          if-no-files-found: error
          retention-days: 1

  build-flare-windows:
    name: Build lflare (windows-x86_64)
    needs: verify
    runs-on: windows-latest
    env:
      LIBPCAP_LIBDIR: ${{ github.workspace }}\landscape-flare\vendor\npcap-sdk\Lib\x64
    timeout-minutes: 45

    steps:
      - name: Check out landscape-kit
        uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-flare-windows

      - name: Build distribution binary
        run: cargo build --locked --profile dist -p landscape-flare --bin lflare

      - name: Stage and verify binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/dist/lflare.exe dist/lflare-windows-x86_64.exe
          $bytes = [System.IO.File]::ReadAllBytes("$PWD/dist/lflare-windows-x86_64.exe")
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "lflare-windows-x86_64.exe is not a valid PE binary"
            exit 1
          }
          $file = Get-Item dist/lflare-windows-x86_64.exe
          "### lflare windows-x86_64`n`n- Size: $($file.Length) bytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lflare-windows-x86_64.exe
          path: dist/lflare-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build, build-flare-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out landscape-kit
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: lkit-musl-*
          path: dist
          merge-multiple: true

      - name: Download flare binaries
        uses: actions/download-artifact@v4
        with:
          pattern: lflare-*
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          install -m 0755 scripts/install-lkit.sh dist/install.sh
          sed -i "s|releases/latest/download$|releases/download/${TAG}|" dist/install.sh
          cd dist
          sha256sum lkit-* lflare-linux-* lflare-windows-x86_64.exe install.sh >SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/lkit-* \
            dist/lflare-linux-* \
            dist/lflare-windows-x86_64.exe \
            dist/SHA256SUMS \
            dist/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"
