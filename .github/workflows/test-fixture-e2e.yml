name: Test fixture e2e

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - lkit-cli/**
      - .github/workflows/test-fixture-e2e.yml
      - .github/workflows/test-rust.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - lkit-cli/**
      - .github/workflows/test-fixture-e2e.yml
      - .github/workflows/test-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Fixture e2e (${{ matrix.domain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: console
            filter: console
          - domain: daemon
            filter: daemon
          - domain: install
            filter: install
          - domain: manager-backends
            filter: manager_backends
          - domain: migrate
            filter: migrate
          - domain: network
            filter: network
          - domain: reinit
            filter: reinit
          - domain: self
            filter: self_cmd
          - domain: switch
            filter: switch
          - domain: uninstall
            filter: uninstall
          - domain: update
            filter: update
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fixture-e2e-${{ matrix.domain }}
          cache-on-failure: true
      - name: Run ${{ matrix.domain }} fixture e2e tests
        env:
          LKIT_E2E: "1"
        run: >-
          cargo test --locked -p lkit-cli --features test-support
          --test install_fixture_e2e ${{ matrix.filter }}
