name: Test Docker mirror switching

# Public mirror traffic is deliberately opt-in by branch name, not PRs,
# schedules, or workflow_dispatch. Push the commit under test to ci-mirror.
on:
  push:
    branches: [ci-mirror]

permissions:
  contents: read

concurrency:
  group: mirror-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirrors:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-mirror'
    name: Docker mirror switching (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            allow_arm: "0"
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            allow_arm: "1"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out landscape-kit
        uses: actions/checkout@v7
      - name: Verify mirror network policy
        run: bash scripts/test-mirror-network-guard.sh
      - name: Verify Docker
        run: |
          docker info
          docker compose version
      - name: Run Docker mirror E2E
        env:
          LKIT_E2E_ALLOW_ARM: ${{ matrix.allow_arm }}
          LKIT_ALLOW_MIRROR_NETWORK: "1"
        run: scripts/test-docker-mirrors.sh

  alpine-mirror:
    needs: mirrors
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-mirror'
    uses: ./.github/workflows/test-qemu-alpine.yml
    with:
      allow_mirror_network: true
