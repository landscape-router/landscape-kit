name: Test Docker mirror switching

on:
  push:
    branches: [dev, main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - lkit-cli/**
      - scripts/docker-mirrors/**
      - scripts/test-docker-mirrors.sh
      - .github/workflows/test-docker-mirrors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirrors:
    name: Docker mirror switching (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            allow_arm: "0"
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            allow_arm: "1"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out landscape-kit
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker info
          docker compose version

      - name: Run Docker mirror E2E
        env:
          LKIT_E2E_ALLOW_ARM: ${{ matrix.allow_arm }}
        run: scripts/test-docker-mirrors.sh
