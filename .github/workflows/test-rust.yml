name: Test Rust workspace

on:
  pull_request:
    paths:
      - scripts/lib/mirror-network-guard.sh
      - scripts/test-mirror-network-guard.sh
      - scripts/ci/**
      - Cargo.lock
      - Cargo.toml
      - landscape-terrain-proto/**
      - crates/**
      - lkit-cli/**
      - .github/workflows/test-rust.yml
  push:
    branches: [dev, main, build/musl-static]
    paths:
      - scripts/lib/mirror-network-guard.sh
      - scripts/test-mirror-network-guard.sh
      - scripts/ci/**
      - Cargo.lock
      - Cargo.toml
      - landscape-terrain-proto/**
      - crates/**
      - lkit-cli/**
      - .github/workflows/test-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check mirror network opt-in policy
        run: bash scripts/test-mirror-network-guard.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo build --locked --workspace --features test-support
      - name: Verify native task tracing in an isolated test binary
        run: cargo test --locked -p landscape-terrain-proto --test task_tracing
      - name: Run unit tests
        run: cargo test --locked --workspace --features test-support --lib
      - name: Check test selection runner
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Run reviewed CLI unit tests
        run: |
          python3 scripts/ci/run-test-selection.py \
            --manifest scripts/ci/lkit-unit-tests.txt \
            --report ci-artifacts/cli-unit-inventory.json -- \
            cargo test --locked -p lkit-cli --features test-support --bin lkit
      - name: Upload CLI test inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-unit-inventory
          path: ci-artifacts/cli-unit-inventory.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Run CLI i18n tests
        run: cargo test --locked -p lkit-cli --features test-support --test i18n_cli
