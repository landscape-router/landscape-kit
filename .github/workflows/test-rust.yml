name: Test Rust workspace

on:
  pull_request:
    paths:
      - scripts/lib/mirror-network-guard.sh
      - scripts/test-mirror-network-guard.sh
      - Cargo.lock
      - Cargo.toml
      - landscape-terrain-proto/**
      - crates/**
      - lkit-cli/**
      - .github/workflows/test-rust.yml
  push:
    branches: [dev, main, build/musl-static]
    paths:
      - scripts/lib/mirror-network-guard.sh
      - scripts/test-mirror-network-guard.sh
      - Cargo.lock
      - Cargo.toml
      - landscape-terrain-proto/**
      - crates/**
      - lkit-cli/**
      - .github/workflows/test-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check mirror network opt-in policy
        run: bash scripts/test-mirror-network-guard.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo build --locked --workspace --features test-support
      - name: Verify native task tracing in an isolated test binary
        run: cargo test --locked -p landscape-terrain-proto --test task_tracing
      - name: Run unit tests
        run: cargo test --locked --workspace --features test-support --lib
      - name: Run init, Cgroup and mirror CLI unit tests
        run: |
          for module in \
            check::init::tests \
            check::openrc::tests \
            service::manager::init_detection_tests \
            console::tests::cgroup \
            console::tests::gates \
            deployment::cgroup::tests \
            check::service::tests \
            check::kernel::tests \
            mirror::apt::parse::tests \
            mirror::apt::apply_tests \
            mirror::dnf::apply_tests \
            mirror::dnf::parse::tests \
            mirror::pacman::tests \
            mirror::apk::tests \
            mirror::apk::apply_tests \
            mirror::availability::tests \
            software::docker::tests::apt_source_file \
            software::docker::tests::dnf_repo_file \
            software::docker::tests::apt_arch_maps_common_architectures \
            software::docker::apk_tests \
            service::openrc::tests::renders; do
            cargo test --locked -p lkit-cli --features test-support --bin lkit "$module"
          done
      - name: Run CLI i18n tests
        run: cargo test --locked -p lkit-cli --features test-support --test i18n_cli
