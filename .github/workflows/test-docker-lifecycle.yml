name: Test Docker functional lifecycle

on:
  push:
    branches: [dev, main]
    paths:
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - crates/lkit-cli/**
      - crates/lkit-publish/**
      - crates/lkit-repository/**
      - crates/lkit-test-fixture/**
      - scripts/docker-e2e/**
      - scripts/test-docker-lifecycle.sh
      - .github/workflows/test-docker-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Docker functional lifecycle (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            allow_arm: "0"
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            allow_arm: "1"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out landscape-kit
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker info
          docker compose version

      - name: Run Docker functional E2E
        env:
          LKIT_E2E_ALLOW_ARM: ${{ matrix.allow_arm }}
        run: scripts/test-docker-lifecycle.sh
