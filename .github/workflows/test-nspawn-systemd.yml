name: systemd-nspawn integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  nspawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nspawn tooling
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap systemd-container
      - name: Build integration binaries
        run: |
          cargo build --locked --release --features test-support -p lkit-cli --bin lkit
          cargo build --locked --release -p lkit-test-fixture --bin landscape-webserver
      - name: Run real-systemd integration
        env:
          LKIT_NSPAWN_PREBUILT_DIR: ${{ github.workspace }}/target/release
        run: sudo --preserve-env=LKIT_NSPAWN_PREBUILT_DIR scripts/test-nspawn-systemd.sh
